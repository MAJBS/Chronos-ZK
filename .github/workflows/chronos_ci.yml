name: Chronos-ZK Formal Verification & Regression CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  formal-verification-suite:
    name: Rust HDC/L4 Pruner + Z3 SMT Certification
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Chronos-ZK Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Install Z3 SMT Solver & Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r smt_verifier/requirements.txt

      - name: 4. Set up Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 5. Compile Rust Core Pruner (Zero Warnings Enforced)
        working-directory: ./core_pruner
        run: cargo build --release

      - name: 6. Generate & Verify Iden3 Binary (.r1cs) Test Fixtures
        run: |
          python -m tools.generate_binary_r1cs
          ./core_pruner/target/release/core_pruner --input circuits/vulnerable/iszero_vulnerable.r1cs --output pruned_ir.json --cpu
          python -m smt_verifier.witness_uniqueness --ir pruned_ir.json --expect VULNERABLE
          ./core_pruner/target/release/core_pruner --input circuits/secure/iszero_secure.r1cs --output pruned_ir.json --cpu
          python -m smt_verifier.witness_uniqueness --ir pruned_ir.json --expect SECURE
          ./core_pruner/target/release/core_pruner --input circuits/vulnerable/merkle_malleable.r1cs --output pruned_ir.json --cpu
          python -m smt_verifier.witness_uniqueness --ir pruned_ir.json --expect VULNERABLE
          ./core_pruner/target/release/core_pruner --input circuits/secure/merkle_secure.r1cs --output pruned_ir.json --cpu
          python -m smt_verifier.witness_uniqueness --ir pruned_ir.json --expect SECURE

      - name: 7. Verify SnarkJS R1CS JSON Ingestion (circomlib)
        run: |
          ./core_pruner/target/release/core_pruner --input circuits/vulnerable/circomlib_iszero_vulnerable.snarkjs.json --output pruned_ir.json --cpu
          python -m smt_verifier.witness_uniqueness --ir pruned_ir.json --expect VULNERABLE
          ./core_pruner/target/release/core_pruner --input circuits/secure/circomlib_iszero_secure.snarkjs.json --output pruned_ir.json --cpu
          python -m smt_verifier.witness_uniqueness --ir pruned_ir.json --expect SECURE

      - name: 8. Execute Complete 6/6 Formal Regression Suite
        run: |
          chmod +x run_all_tests.sh audit_circuit.sh
          ./run_all_tests.sh